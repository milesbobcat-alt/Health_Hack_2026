<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient View</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Open Sans", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --page-background: #f2f2f2;
        --surface: #ffffff;
        --text: #1f1f1f;
        --muted-text: #595959;
        --placeholder: #737373;
        --link: #3834a8;
        --visited-link: #9a5ba5;
        --accent: #db0084;
        --accent-action: #b0006a;
        --border: #767676;
        --disabled-background: #e0e0e0;
        --disabled-text: #595959;
        --focus: #a00060;
        --error: #b20000;
      }

      :root[data-theme="beige"] {
        --page-background: #f5f0e6;
        --surface: #fffdf8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-background: #1f1f1f;
        --surface: #292929;
        --text: #f5f5f5;
        --muted-text: #d0d0d0;
        --placeholder: #c2c2c2;
        --link: #d478ff;
        --visited-link: #e6a6ff;
        --accent: #db0084;
        --accent-action: #b0006a;
        --border: #b8b8b8;
        --disabled-background: #454545;
        --disabled-text: #d0d0d0;
        --focus: #ff83ca;
        --error: #ff8585;
      }

      html {
        min-height: 100%;
        font-size: 100%;
        background-color: var(--page-background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background-color: var(--page-background);
        color: var(--text);
        font-family: inherit;
        font-size: 1.25rem;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.01em;
        word-spacing: 0.08em;
        text-align: left;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--text);
        font-weight: 600;
        line-height: 1.35;
        text-align: left;
      }

      p {
        max-width: 70ch;
        margin-block: 0 2em;
      }

      a {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      a:visited {
        color: var(--visited-link);
      }

      a:hover {
        text-decoration-color: var(--accent);
        text-decoration-thickness: 0.15em;
      }

      :focus-visible {
        outline: 3px dashed var(--focus);
        outline-offset: 3px;
      }

      button,
      input,
      select,
      textarea {
        color: var(--text);
        font: inherit;
      }

      button,
      input[type="button"],
      input[type="submit"],
      input[type="reset"],
      .button {
        min-width: 44px;
        min-height: 44px;
        padding: 1.25rem 1.875rem;
        border: 2px solid var(--link);
        border-radius: 3px;
        background-color: var(--link);
        color: #ffffff;
        cursor: pointer;
        text-align: center;
      }

      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled,
      .button[aria-disabled="true"] {
        border-color: var(--disabled-background);
        background-color: var(--disabled-background);
        color: var(--disabled-text);
        cursor: not-allowed;
      }

      .button-secondary {
        border-color: var(--link);
        background-color: var(--surface);
        color: var(--link);
      }

      .button-tertiary {
        border-color: transparent;
        background-color: transparent;
        color: var(--link);
        text-decoration: underline;
      }

      @media (hover: hover) {
        button:not(:disabled):hover,
        input[type="button"]:not(:disabled):hover,
        input[type="submit"]:not(:disabled):hover,
        input[type="reset"]:not(:disabled):hover,
        .button:not([aria-disabled="true"]):hover {
          border-color: var(--accent-action);
          background-color: var(--accent-action);
        }

        .button-secondary:not([aria-disabled="true"]):hover {
          color: #ffffff;
        }

        .button-tertiary:not([aria-disabled="true"]):hover {
          background-color: var(--surface);
          color: var(--accent-action);
        }
      }

      input:not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        box-sizing: border-box;
        min-height: 3rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 3px;
        background-color: var(--surface);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border: 2px solid var(--link);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--placeholder);
        opacity: 1;
      }

      input[type="search"] {
        min-width: 27ch;
      }

      input[type="checkbox"],
      input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: var(--link);
      }

      label {
        display: inline-block;
        min-height: 44px;
        padding: 0.5rem 0.25rem;
        color: var(--text);
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
      }

      [aria-invalid="true"],
      .field-error {
        border-color: var(--error);
      }

      .field-error {
        color: var(--error);
      }

      [role="tab"][aria-selected="true"],
      .tab[aria-selected="true"] {
        border-bottom: 3px solid var(--link);
        color: var(--link);
        font-weight: 600;
      }

      :root[data-text-spacing="wide"] body {
        line-height: 1.5;
        letter-spacing: 0.2em;
        word-spacing: 0.16em;
      }

      ::selection {
        background-color: var(--link);
        color: #ffffff;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
  </body>
</html>

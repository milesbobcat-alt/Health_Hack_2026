<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your care plan</title>
  <style>
    :root { font-family: "Open Sans", Arial, sans-serif; color:#182433; background:#f5f7fb; }
    * { box-sizing:border-box; } body { margin:0; line-height:1.45; }
    main { width:min(100% - 2rem, 760px); margin:0 auto; padding:1.5rem 0 3rem; }
    header { padding:.8rem max(1rem,calc((100vw - 760px)/2)); border-bottom:1px solid #dce3ed; background:#fff; color:#315fc4; font-size:.85rem; font-weight:700; }
    h1 { margin:.25rem 0 .5rem; font-size:clamp(1.8rem,5vw,2.4rem); letter-spacing:-.035em; line-height:1.15; }
    h2 { margin:0; font-size:1.05rem; }
    .lead { margin:0; color:#58677c; font-size:.95rem; }
    .hero { padding:1.3rem 1.4rem; border:1px solid #dce3ed; border-radius:12px; background:#fff; }
    .eyebrow { color:#315fc4; font-size:.73rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .progress-card { margin-top:1rem; display:grid; gap:.55rem; padding:.8rem .9rem; border:1px solid #e1e7ef; border-radius:9px; background:#f8faff; }
    .progress-head { display:flex; justify-content:space-between; gap:1rem; font-size:.92rem; font-weight:700; }
    progress { width:100%; height:.55rem; accent-color:#315fc4; }
    .group { margin:.8rem 0; padding:.9rem 1rem; background:#fff; border:1px solid #dce3ed; border-radius:10px; }
    .group-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.35rem; }
    .count { color:#617087; font-size:.8rem; }
    .task { display:flex; align-items:flex-start; gap:.7rem; padding:.75rem .1rem; border-top:1px solid #edf0f4; cursor:pointer; }
    .task input { width:1.25rem; height:1.25rem; margin:.08rem 0 0; flex:none; accent-color:#315fc4; }
    .task span { display:block; font-size:1rem; font-weight:550; }
    .task small { display:inline-block; margin-top:.2rem; color:#617087; font-size:.78rem; }
    .task.done span { color:#748196; text-decoration:line-through; }
    .warnings { border-left:3px solid #b23b3b; background:#fff; }
    .warnings h2 { margin-bottom:.45rem; }
    .warnings p { margin:.1rem 0; color:#617087; font-size:.85rem; }
    .warnings li { margin:.35rem 0; }
    .medication-panel { margin:.8rem 0; padding:.9rem 1rem; border:1px solid #dce3ed; border-radius:10px; background:#fff; }
    .medication-panel h2 { margin-bottom:.6rem; }
    .medication-panel > p { color:#617087; font-size:.85rem; }
    .medication-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .medication-table th,.medication-table td { width:50%; padding:.65rem; border:1px solid #dce3ed; text-align:left; vertical-align:top; }
    .medication-table th { background:#f5f8fd; color:#315fc4; }
    .medication-table td { overflow-wrap:anywhere; }
    .medication-table tr:nth-child(even) td { background:#fbfcfe; }
    @media(max-width:600px) { .medication-table th,.medication-table td { padding:.5rem; font-size:.88rem; } }
    #checklist-status { min-height:1.3rem; } #expiry-note { color:#68778b; font-size:.78rem; }
    a { color:#315fc4; } :focus-visible { outline:3px solid #315fc4; outline-offset:3px; }
    @media(max-width:600px) { .hero { padding:1rem; } .group { padding:.8rem; } }
  </style>
</head>
<body>
  <header>Care checklist</header>
<main>
  <section class="hero"><div class="eyebrow">Your next steps</div><h1>Care checklist</h1><p class="lead">Check off each step as you complete it.</p>
    <div class="progress-card"><div class="progress-head"><span id="checklist-status" role="status" aria-live="polite">Loading checklist…</span><span id="progress-number"></span></div><progress id="progress" value="0" max="1"></progress></div>
  </section>
  <div id="checklist-items"></div><section id="warning-section" class="group warnings" hidden><h2>Warning signs</h2><ul id="warning-items"></ul></section>
  <section id="medication-section" class="medication-panel" hidden>
    <h2>Medication comparison</h2><p>Medication lists copied from the provided instructions.</p>
    <table class="medication-table"><thead><tr><th>Before hospitalization</th><th>After hospitalization</th></tr></thead><tbody id="medication-rows"></tbody></table>
  </section>
  <p id="expiry-note"></p>
</main>
<script>
(() => {
  const id = location.pathname.split("/").filter(Boolean).at(-1);
  const status = document.querySelector("#checklist-status");
  const container = document.querySelector("#checklist-items");
  const names = { medication:"Medicines", care:"Care", testing:"Tests", avoid:"Avoid / do not" };
  async function load() {
    try { const response = await fetch(`/api/checklists/${encodeURIComponent(id)}`); const plan = await response.json(); if (!response.ok) throw new Error(plan.error || "Checklist unavailable."); render(plan); }
    catch (error) { status.textContent = error.message; }
  }
  function render(plan) {
    container.replaceChildren(); const completed = plan.items.filter(item => item.done).length;
    status.textContent = completed === plan.items.length ? "All steps checked off" : `${plan.items.length - completed} steps to go`;
    document.querySelector("#progress-number").textContent = `${completed} / ${plan.items.length}`;
    const progress = document.querySelector("#progress"); progress.max = plan.items.length; progress.value = completed;
    for (const [category, name] of Object.entries(names)) {
      const entries = plan.items.map((item,index) => ({item,index})).filter(({item}) => (item.category || "other") === category);
      if (!entries.length) continue;
      const section = document.createElement("section"); section.className = "group";
      const head = document.createElement("div"); head.className = "group-head"; const h = document.createElement("h2"); h.textContent = name;
      const count = document.createElement("span"); count.className = "count"; const left = entries.filter(({item}) => !item.done).length; count.textContent = `${left} left`; head.append(h,count); section.append(head);
      for (const {item,index} of entries) {
        const label = document.createElement("label"); label.className = `task${item.done ? " done" : ""}`;
        const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = item.done;
        const content = document.createElement("div"); const text = document.createElement("span"); text.textContent = item.text;
        content.append(text);
        if (item.frequency === "daily") { const timing = document.createElement("small"); timing.textContent = "Daily"; content.append(timing); }
        label.append(checkbox,content); section.append(label);
        checkbox.addEventListener("change", async () => {
          checkbox.disabled = true;
          try { const response = await fetch(`/api/checklists/${encodeURIComponent(id)}/items`, { method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({index,done:checkbox.checked}) }); const updated = await response.json(); if (!response.ok) throw new Error(updated.error || "Could not save this step."); render(updated); }
          catch(error) { status.textContent = error.message; checkbox.disabled = false; checkbox.checked = !checkbox.checked; }
        });
      }
      container.append(section);
    }
    const warningSection = document.querySelector("#warning-section"); const warningItems = document.querySelector("#warning-items"); warningItems.replaceChildren();
    for (const warning of plan.warnings || []) { const li = document.createElement("li"); li.textContent = warning; warningItems.append(li); }
    warningSection.hidden = !warningItems.children.length;
    const medicationSection = document.querySelector("#medication-section");
    const beforeList = plan.medicationChanges?.before || []; const afterList = plan.medicationChanges?.after || [];
    const rows = document.querySelector("#medication-rows"); rows.replaceChildren();
    if (beforeList.length || afterList.length) {
      const rowCount = Math.max(beforeList.length, afterList.length);
      for (let index = 0; index < rowCount; index++) {
        const row = document.createElement("tr");
        for (const entry of [beforeList[index], afterList[index]]) {
          const cell = document.createElement("td");
          cell.textContent = entry || "N/A";
          row.append(cell);
        }
        rows.append(row);
      }
      medicationSection.hidden = false;
    } else medicationSection.hidden = true;
    document.querySelector("#expiry-note").textContent = `This link expires ${new Date(plan.expiresAt).toLocaleString()}.`;
  }
  void load();
})();
</script>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient View</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Open Sans", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --page-background: #f2f2f2;
        --surface: #ffffff;
        --text: #1f1f1f;
        --muted-text: #595959;
        --placeholder: #737373;
        --link: #3834a8;
        --visited-link: #9a5ba5;
        --accent: #db0084;
        --accent-action: #b0006a;
        --border: #767676;
        --disabled-background: #e0e0e0;
        --disabled-text: #595959;
        --focus: #a00060;
        --error: #b20000;
      }

      :root[data-theme="beige"] {
        --page-background: #f5f0e6;
        --surface: #fffdf8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-background: #1f1f1f;
        --surface: #292929;
        --text: #f5f5f5;
        --muted-text: #d0d0d0;
        --placeholder: #c2c2c2;
        --link: #d478ff;
        --visited-link: #e6a6ff;
        --accent: #db0084;
        --accent-action: #b0006a;
        --border: #b8b8b8;
        --disabled-background: #454545;
        --disabled-text: #d0d0d0;
        --focus: #ff83ca;
        --error: #ff8585;
      }

      html {
        min-height: 100%;
        font-size: 100%;
        background-color: var(--page-background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background-color: var(--page-background);
        color: var(--text);
        font-family: inherit;
        font-size: 1.25rem;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.01em;
        word-spacing: 0.08em;
        text-align: left;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--text);
        font-weight: 600;
        line-height: 1.35;
        text-align: left;
      }

      p {
        max-width: 70ch;
        margin-block: 0 2em;
      }

      a {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      a:visited {
        color: var(--visited-link);
      }

      a:hover {
        text-decoration-color: var(--accent);
        text-decoration-thickness: 0.15em;
      }

      :focus-visible {
        outline: 3px dashed var(--focus);
        outline-offset: 3px;
      }

      button,
      input,
      select,
      textarea {
        color: var(--text);
        font: inherit;
      }

      button,
      input[type="button"],
      input[type="submit"],
      input[type="reset"],
      .button {
        min-width: 44px;
        min-height: 44px;
        padding: 1.25rem 1.875rem;
        border: 2px solid var(--link);
        border-radius: 3px;
        background-color: var(--link);
        color: #ffffff;
        cursor: pointer;
        text-align: center;
      }

      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled,
      .button[aria-disabled="true"] {
        border-color: var(--disabled-background);
        background-color: var(--disabled-background);
        color: var(--disabled-text);
        cursor: not-allowed;
      }

      .button-secondary {
        border-color: var(--link);
        background-color: var(--surface);
        color: var(--link);
      }

      .button-tertiary {
        border-color: transparent;
        background-color: transparent;
        color: var(--link);
        text-decoration: underline;
      }

      @media (hover: hover) {
        button:not(:disabled):hover,
        input[type="button"]:not(:disabled):hover,
        input[type="submit"]:not(:disabled):hover,
        input[type="reset"]:not(:disabled):hover,
        .button:not([aria-disabled="true"]):hover {
          border-color: var(--accent-action);
          background-color: var(--accent-action);
        }

        .button-secondary:not([aria-disabled="true"]):hover {
          color: #ffffff;
        }

        .button-tertiary:not([aria-disabled="true"]):hover {
          background-color: var(--surface);
          color: var(--accent-action);
        }
      }

      input:not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        box-sizing: border-box;
        min-height: 3rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 3px;
        background-color: var(--surface);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border: 2px solid var(--link);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--placeholder);
        opacity: 1;
      }

      input[type="search"] {
        min-width: 27ch;
      }

      input[type="checkbox"],
      input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: var(--link);
      }

      label {
        display: inline-block;
        min-height: 44px;
        padding: 0.5rem 0.25rem;
        color: var(--text);
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
      }

      [aria-invalid="true"],
      .field-error {
        border-color: var(--error);
      }

      .field-error {
        color: var(--error);
      }

      [role="tab"][aria-selected="true"],
      .tab[aria-selected="true"] {
        border-bottom: 3px solid var(--link);
        color: var(--link);
        font-weight: 600;
      }

      :root[data-text-spacing="wide"] body {
        line-height: 1.5;
        letter-spacing: 0.2em;
        word-spacing: 0.16em;
      }

      ::selection {
        background-color: var(--link);
        color: #ffffff;
      }

      main {
        width: min(100% - 2rem, 52rem);
        margin-inline: auto;
        padding-block: 2rem;
      }

      .patient-card {
        display: grid;
        gap: 1rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 3px;
        background-color: var(--surface);
      }

      .patient-card h1,
      .patient-card p {
        margin: 0;
      }

      .tabs,
      .playback-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      [role="tab"] {
        background: var(--surface);
        color: var(--link);
      }

      [role="tabpanel"] {
        padding-block: 1rem;
      }

      #patient-data {
        width: 100%;
        min-height: 15rem;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .patient-status {
        min-height: 1.5em;
        color: var(--muted-text);
      }

      .patient-status[data-state="error"] {
        color: var(--error);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="patient-card" aria-labelledby="patient-information-heading">
        <h1 id="patient-information-heading">Your discharge instructions</h1>
        <p id="load-status" class="patient-status" role="status" aria-live="polite">Loading your discharge information…</p>

        <div class="tabs" role="tablist" aria-label="Discharge information">
          <button id="document-tab" type="button" role="tab" aria-selected="true" aria-controls="document-panel">Discharge document</button>
          <button id="transcript-tab" type="button" role="tab" aria-selected="false" aria-controls="transcript-panel" tabindex="-1">Nurse transcript</button>
        </div>

        <section id="document-panel" role="tabpanel" aria-labelledby="document-tab">
          <h2>Original discharge document</h2>
          <p>Open or download the PDF provided by your care team.</p>
          <a id="pdf-link" class="button" target="_blank" rel="noopener noreferrer" hidden>View or download discharge PDF</a>
        </section>

        <section id="transcript-panel" role="tabpanel" aria-labelledby="transcript-tab" hidden>
          <h2>Nurse transcript</h2>
          <p id="patient-data" aria-live="polite">Your instructions will appear here.</p>
          <div class="playback-actions">
            <button id="read-aloud" type="button" disabled>Play Out Loud</button>
            <button id="stop-reading" type="button" disabled>Stop playback</button>
          </div>
          <p id="speech-status" class="patient-status" role="status" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <script>
      (() => {
        const patientData = document.querySelector("#patient-data");
        const loadStatus = document.querySelector("#load-status");
        const pdfLink = document.querySelector("#pdf-link");
        const documentTab = document.querySelector("#document-tab");
        const transcriptTab = document.querySelector("#transcript-tab");
        const documentPanel = document.querySelector("#document-panel");
        const transcriptPanel = document.querySelector("#transcript-panel");
        const readButton = document.querySelector("#read-aloud");
        const stopButton = document.querySelector("#stop-reading");
        const speechStatus = document.querySelector("#speech-status");
        let transcript = "";

        function setStatus(element, message, state = "idle") {
          element.textContent = message;
          element.dataset.state = state;
        }

        function selectTab(selectedTab) {
          const showTranscript = selectedTab === transcriptTab;
          documentTab.setAttribute("aria-selected", String(!showTranscript));
          transcriptTab.setAttribute("aria-selected", String(showTranscript));
          documentTab.tabIndex = showTranscript ? -1 : 0;
          transcriptTab.tabIndex = showTranscript ? 0 : -1;
          documentPanel.hidden = showTranscript;
          transcriptPanel.hidden = !showTranscript;
        }

        async function loadDischarge() {
          const dischargeId = new URLSearchParams(window.location.search).get("id");
          if (!dischargeId) {
            setStatus(loadStatus, "This patient link is missing its discharge ID.", "error");
            return;
          }

          try {
            const response = await fetch(`/api/discharge/${encodeURIComponent(dischargeId)}`);
            const result = await response.json();
            if (!response.ok) {
              throw new Error(result.error || "Discharge information could not be loaded.");
            }
            transcript = result.transcript || "";
            patientData.textContent = transcript || "No transcript was provided.";
            if (result.pdfUrl) {
              pdfLink.href = result.pdfUrl;
              pdfLink.download = result.pdfOriginalName || "discharge.pdf";
              pdfLink.textContent = `View or download ${result.pdfOriginalName || "discharge PDF"}`;
              pdfLink.hidden = false;
            } else {
              documentTab.hidden = true;
              selectTab(transcriptTab);
            }
            setStatus(loadStatus, "Your discharge information is ready.");
            readButton.disabled = !transcript || !("speechSynthesis" in window);
          } catch (error) {
            setStatus(loadStatus, error instanceof TypeError
              ? "Could not connect to the discharge server. Check your connection and refresh this page."
              : error.message, "error");
          }
        }

        function stopReading() {
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          stopButton.disabled = true;
          readButton.disabled = !transcript || !("speechSynthesis" in window);
        }

        documentTab.addEventListener("click", () => selectTab(documentTab));
        transcriptTab.addEventListener("click", () => selectTab(transcriptTab));
        readButton.addEventListener("click", () => {
          if (!transcript || !("speechSynthesis" in window)) {
            setStatus(speechStatus, "Audio playback is not available in this browser.", "error");
            return;
          }
          readButton.disabled = true;
          stopButton.disabled = false;
          setStatus(speechStatus, "Playing discharge instructions.");
          const utterance = new SpeechSynthesisUtterance(transcript);
          utterance.addEventListener("end", () => {
            stopButton.disabled = true;
            readButton.disabled = false;
            setStatus(speechStatus, "Playback finished.");
          });
          utterance.addEventListener("error", () => {
            stopButton.disabled = true;
            readButton.disabled = false;
            setStatus(speechStatus, "Audio playback could not be completed.", "error");
          });
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        });

        stopButton.addEventListener("click", () => {
          stopReading();
          setStatus(speechStatus, "Playback stopped.");
        });

        window.addEventListener("pagehide", stopReading);
        void loadDischarge();
      })();
    </script>
  </body>
</html>
